<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* Enlarged Menu Bar Styling */
        .menu-bar {
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px; /* increased padding */
        }

        .menu-left a {
            color: white;
            padding: 16px 24px; /* larger clickable area */
            text-decoration: none;
            font-weight: bold;
            font-size: 18px; /* increased font size */
            transition: color 0.3s;
        }

        .menu-left a:hover {
            color: #ffffff;
            background-color: #333;
        }

        .menu-right a {
            color: rgb(55, 18, 147);
            padding: 12px 20px; /* larger buttons */
            text-decoration: none;
            font-weight: bold;
            font-size: 18px; /* larger text */
            border: 1px solid white;
            border-radius: 4px;
            margin-left: 15px;
            transition: all 0.3s;
        }

        .menu-right a:hover {
            color: black;
            background-color: white;
        }

        /* Container styling */
        .container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .left img {
            max-width: 100%;
            height: auto;
        }

        .left p {
            font-size: 1.3em;
            margin-top: 10px;
        }

        .right .box {
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<!-- Enlarged Menu Bar -->
<div class="menu-bar">
    <div class="menu-left">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/services/">Services</a>
        <a href="/contact/">Contact</a>
    </div>
    <div class="menu-right">
        <a href="/register/">Register</a>
        <a href="/login/">Login</a>
    </div>
</div>

<div class="container">

    <div class="left">
        <img src="{% static 'images/home.png' %}">
        <p>Secure Certificate Verification Using Blockchain</p>
    </div>

    <div class="left">
        <div class="box">
            <h2>Welcome</h2>
            <p class="center">Explore our platform using the menu above.</p>
        </div>
    </div>

</div>

</body>
</html>
