<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <img src="{% static 'images/login.png' %}" style="width:250px;">
        <p style="color:yellow;">Welcome Back!</p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="box">

            <h2>Login</h2>

            <form method="POST">
                {% csrf_token %}

                <!-- Email -->
                <input type="email" name="email" placeholder="Email">

                <!-- Password Wrapper -->
                <div style="position:relative; width:100%;">

                    <input type="password" id="password" name="password" placeholder="Password"
                           style="
                           width:100%;
                           padding:10px 45px 10px 10px;
                           border:none;
                           border-radius:8px;
                           box-sizing:border-box;
                           ">

                    <!-- Eye Icon -->
                    <span onclick="togglePassword()" 
                          style="
                          position:absolute;
                          right:15px;
                          top:50%;
                          transform:translateY(-50%);
                          cursor:pointer;
                          font-size:18px;
                          ">
                        👁️
                    </span>

                </div>

                <!-- Button -->
                <button type="submit">Login</button>

            </form>

            <p>Don't have account? <a href="/register/">Register</a></p>

        </div>
    </div>

</div>

<!-- JS -->
<script>
function togglePassword() {
    var pass = document.getElementById("password");
    var icon = event.target;

    if (pass.type === "password") {
        pass.type = "text";
        icon.innerHTML = "🙈";
    } else {
        pass.type = "password";
        icon.innerHTML = "👁️";
    }
}
</script>

</body>
</html>
