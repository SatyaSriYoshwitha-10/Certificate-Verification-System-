<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
</head>

<body style="margin:0; font-family:Arial; background:linear-gradient(135deg,#ff00cc,#3333ff); height:100vh; display:flex; justify-content:center; align-items:center;">

<div style="width:800px; height:500px; display:flex; border-radius:10px; overflow:hidden; background:white;">

    <!-- LEFT SIDE WITH BACKGROUND IMAGE -->
    <div style="
        width:50%;
        background-image:url('{% static "images/bg.jpg" %}');
        background-size:cover;
        background-position:center;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        text-align:center;
        position:relative;
    ">

        <!-- Dark overlay -->
        <div style="
            position:absolute;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0,0,0,0.5);
        "></div>

        <!-- Content -->
        <div style="position:relative; z-index:1;">
            <h1 style="font-size:28px;">Welcome Page</h1>
        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div style="width:50%; padding:40px; display:flex; align-items:center;">

        <form method="POST" style="width:100%;">
            {% csrf_token %}

            <h2>Create Account</h2>

            {% if error %}
                <p style="color:red;">{{ error }}</p>
            {% endif %}

            <!-- Name -->
            <input type="text" name="name" placeholder="Full Name"
                   value="{{ name_value|default:'' }}"
                   style="width:100%; padding:10px; margin:10px 0; border:none; border-bottom:2px solid #ccc; outline:none;">

            <!-- Email -->
            <input type="email" name="email" placeholder="Email"
                   value="{{ email_value|default:'' }}"
                   style="width:100%; padding:10px; margin:10px 0; border:none; border-bottom:2px solid #ccc; outline:none;">

            <!-- Password with Eye Icon -->
            <div style="position:relative;">
                <input type="password" id="password" name="password" placeholder="Password"
                       style="width:100%; padding:10px; margin:10px 0; border:none; border-bottom:2px solid #ccc; outline:none;">

                <span onclick="togglePassword()" 
                      style="position:absolute; right:10px; top:15px; cursor:pointer;">
                    👁️
                </span>
            </div>

            <!-- Role -->
            <select name="role"
                    style="width:100%; padding:10px; margin:10px 0; border:none; border-bottom:2px solid #ccc; outline:none;">
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="college">College</option>
                <option value="company">Company</option>
            </select>

            <!-- Button -->
            <button type="submit"
                    style="width:100%; padding:12px; margin-top:15px; background:linear-gradient(90deg,#ff00cc,#3333ff); color:white; border:none; border-radius:5px; cursor:pointer;">
                Register
            </button>

            <!-- Login Link -->
            <p style="margin-top:10px; font-size:14px;">
                Already have an account? <a href="/login/">Login</a>
            </p>

        </form>

    </div>

</div>

<!-- JS for Password Toggle -->
<script>
function togglePassword() {
    var pass = document.getElementById("password");

    if (pass.type === "password") {
        pass.type = "text";
    } else {
        pass.type = "password";
    }
}
</script>

</body>
</html>
